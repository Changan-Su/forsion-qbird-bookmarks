name: Bluebird checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node verify.mjs
      - run: python3 -m unittest discover -s tests
      - run: bash -n install.sh
